[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project]
name = "ari-coach"
version = "0.1.0"
description = "Ari's triathlon coach: Garmin MCP + plan ownership + Hebrew dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "garminconnect==0.3.2",
    "requests==2.33.0",
    # mcp 2.x renamed mcp.server.fastmcp -> mcp.server.mcpserver (FastMCP ->
    # MCPServer). Cap until the server is ported to the new API.
    "mcp>=1.28.1,<2",
    "fitparse>=1.2.0",
]

[project.scripts]
garmin-mcp = "garmin_mcp:main"
garmin-mcp-auth = "garmin_mcp.auth_cli:main"
ari-morning = "ari_coach.morning:main"
ari-dashboard = "ari_coach.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp", "src/ari_coach"]
# The coaching brief must travel inside the wheel. Left in config/ it is
# visible in the repository and absent from the installed package, so a
# uvx-launched server loads with no instructions at all -- and a coach with
# no instructions is just Claude with Garmin access.
artifacts = ["src/ari_coach/coach-instructions.md"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
]

